[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcst-net"
version = "1.0.0"
description = "Mask-preserving dual-time forecasting for airfare alerts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "DCST-Net Authors"}]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[project.scripts]
dcst = "dcstnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
